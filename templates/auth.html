<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ 'Sign up' if mode == 'signup' else 'Log in' }} - Class Chat</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="login">
    <div class="login-card">
      <div class="avatar big">#</div>
      <h1>Class Chat</h1>

      {% if mode == 'signup' %}
        <p>Create your account</p>
        <form method="post" action="{{ url_for('signup') }}">
          <input name="username" placeholder="Choose a username" maxlength="20"
                 autocomplete="username" required>
          <input name="password" type="password" placeholder="Password (min 6 characters)"
                 autocomplete="new-password" required>
          <input name="confirm" type="password" placeholder="Confirm password"
                 autocomplete="new-password" required>
          <button type="submit">Sign up</button>
        </form>
        <p class="switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
      {% else %}
        <p>Welcome back</p>
        <form method="post" action="{{ url_for('login') }}">
          <input name="username" placeholder="Username" maxlength="20"
                 autocomplete="username" required>
          <input name="password" type="password" placeholder="Password"
                 autocomplete="current-password" required>
          <button type="submit">Log in</button>
        </form>
        <p class="switch">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
      {% endif %}

      {% if error %}<p class="error">{{ error }}</p>{% endif %}
    </div>
  </div>
</body>
</html>
