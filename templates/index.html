<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Chat</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div id="app" class="app" data-username="{{ username }}">
    <header class="topbar">
      <div class="avatar">#</div>
      <div>
        <div class="title">Class Chat</div>
        <div id="online" class="subtitle">connecting...</div>
      </div>
      <a class="logout" href="{{ url_for('logout') }}">Log out ({{ username }})</a>
    </header>

    <main id="messages" class="messages"></main>

    <footer class="composer">
      <input id="message-input" placeholder="Write a message..." autocomplete="off" maxlength="500">
      <button id="send-btn" aria-label="Send">➤</button>
    </footer>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
